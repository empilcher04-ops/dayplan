        const flip = () => { if (x.log[day]) delete x.log[day]; else x.log[day] = true; save(); render(); };
        if (el.classList.contains('check') && !x.log[day]) animateComplete(id, flip); else flip();
        break;
      }
      case 'cal-nav': {
        const [y, m] = calMonth.split('-').map(Number);
        const d = new Date(y, m - 1 + Number(el.dataset.dir), 1);
        calMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
        calSel = calMonth === t.slice(0, 7) ? t : `${calMonth}-01`;
        render(); break;
      }
      case 'cal-pick': calSel = el.dataset.day; render(); break;
      case 'cal-today': calSel = t; calMonth = t.slice(0, 7); render(); break;
      case 'blk-nav': blkDate = addDays(blkDate, Number(el.dataset.dir)); blkScroll = true; render(); break;
      case 'blk-today': blkDate = t; blkScroll = true; render(); break;
      case 'hpreset': syncDraft(); sheet.draft.days = el.dataset.v.split('').map(Number); drawSheet(); break;
      case 'hday': {
        syncDraft(); const v = Number(el.dataset.v), ds = sheet.draft.days;
        sheet.draft.days = ds.includes(v) ? ds.filter(x => x !== v) : ds.concat(v); drawSheet(); break;
      }
      case 'bcolor': syncDraft(); sheet.draft.color = el.dataset.v; drawSheet(); break;
      case 'rem-toggle': {
        syncDraft(); const d = sheet.draft;
        const soon = hhmm(Math.min((new Date().getHours() + 1) * 60, DAY_END - 1));
        if (sheet.kind === 'todo') d.remind = d.remind ? null : `${d.due || t}T${d.start != null ? hhmm(Math.max(d.start - 15, 0)) : d.due && d.due > t ? '09:00' : soon}`;
        else d.remindAt = d.remindAt ? null : '09:00';
        drawSheet(); break;
      }
      case 'rem-before': syncDraft(); sheet.draft.remindBefore = el.dataset.v === '' ? null : Number(el.dataset.v); drawSheet(); break;
      case 'to-iphone': {
        syncDraft();
        const d = sheet.draft;
        if (!(d.title || '').trim()) { const er = $('f-err'); er.textContent = `Give the ${nounOf()} a name first.`; er.hidden = false; break; }
        saveIcs(d.title.trim(), buildIcs(sheet.kind, d, sheet.id || uid()));
        break;
      }
      case 'rem-dismiss': state.acked[el.dataset.key] = true; save(); checkReminders(); break;
      case 'rem-snooze': state.snoozed[el.dataset.key] = Date.now() + 10 * 60000; save(); checkReminders(); toast('Snoozed for 10 minutes', false); break;
      case 'rem-done': {
        const k = el.dataset.kind;
        state.acked[el.dataset.key] = true;
        if (k === 'todo' || k === 'event') { const x = state.todos.find(i => i.id === id); if (x) { x.done = true; x.doneOn = t; } }
        else if (k === 'chore') { const c = state.chores.find(i => i.id === id); if (c && c.lastDone !== t) { c.prevNext = c.next; c.lastDone = t; c.next = nextAfter(c.rule, t); } }
        else if (k === 'habit') { const x = state.habits.find(i => i.id === id); if (x) x.log[t] = true; }
        save(); render(); checkReminders(); break;
      }
      case 'toggle-done': showDone = !showDone; render(); break;
      case 'edit-group': {
        const key = el.dataset.key;
        const closing = editing === key ? el.closest('section') : null;
        if (closing && !REDUCE) { closing.classList.add('edit-exit'); setTimeout(() => { editing = null; render(); }, 170); }
        else { editing = editing === key ? null : key; render(); }
        break;
      }
      case 'move': {
        const list = groups[el.dataset.key] || [];
        const i = list.findIndex(x => x.id === id), j = i + Number(el.dataset.dir);
        if (i < 0 || j < 0 || j >= list.length) break;
        [list[i], list[j]] = [list[j], list[i]];
        list.forEach((x, k) => { x.rank = k; });
        save(); render(); break;
      }
      case 'del-item': {
        const name = LIST[el.dataset.kind];
        animateOut([id], () => {
          const idx = state[name].findIndex(x => x.id === id);
          if (idx < 0) return;
          const [item] = state[name].splice(idx, 1);
          undo = { name, items: [[idx, item]] };
          save(); render(); toast(`Deleted “${item.title}”`);
        });
        break;
      }
      case 'clear-done': {
        const items = state.todos.map((x, i) => [i, x]).filter(([, x]) => isPast(x));
        animateOut(items.map(([, x]) => x.id), () => {
          state.todos = state.todos.filter(x => !isPast(x));
          undo = { name: 'todos', items };
          save(); render(); toast(`Deleted ${plural(items.length, 'completed item')}`);
        });
        break;
      }
      case 'undo': {
        if (undo) { undo.items.forEach(([i, x]) => state[undo.name].splice(i, 0, x)); popId = undo.items.length === 1 ? undo.items[0][1].id : null; undo = null; save(); render(); }
        hideToast(); break;
      }
      case 'clear-examples': state = { examples: false, tab: state.tab, todos: [], chores: [], habits: [], blocks: [], acked: {}, snoozed: {} }; save(); render(); checkReminders(); break;
      case 'scrim': if (e.target === el) closeSheet(); break;
      case 'close': closeSheet(); break;
      case 'due': {
        syncDraft(); const d = sheet.draft; d.due = el.dataset.v || null;
        if (!d.due) { d.start = null; d.end = null; d.until = null; }
        else if (d.until && d.until <= d.due) d.until = addDays(d.due, 1);
        drawSheet(); break;
      }
      case 'ttype': {
        syncDraft(); const d = sheet.draft; d.type = el.dataset.v;
        if (d.type === 'event') { if (!d.due) d.due = t; if (d.start == null) Object.assign(d, defaultSlot(d.due)); }
        drawSheet(); break;
      }
      case 'slot': {
        syncDraft(); const d = sheet.draft;
        if (el.dataset.v) { if (!d.due) d.due = t; if (d.start == null) Object.assign(d, defaultSlot(d.due)); }
        else { d.start = null; d.end = null; }
        drawSheet(); break;
      }
      case 'multi': {
        syncDraft(); const d = sheet.draft;
        if (el.dataset.v) { if (!d.due) d.due = t; d.until = addDays(d.due, 1); } else d.until = null;
        drawSheet(); break;
      }
      case 'tlabel': syncDraft(); sheet.draft.label = sheet.draft.label === el.dataset.v ? null : el.dataset.v; drawSheet(); break;
      case 'high': syncDraft(); sheet.draft.high = !sheet.draft.high; drawSheet(); break;
      case 'rtype': {
        syncDraft(); const r = sheet.draft.rule; r.type = el.dataset.v;
        if (r.type === 'weekly' && !Array.isArray(r.days)) r.days = [parse(t).getDay()];
        if (r.type === 'interval' && !r.every) r.every = 3;
        if (r.type === 'monthly' && !r.dom) r.dom = parse(sheet.draft.start || t).getDate();
        drawSheet(); break;
      }
      case 'wday': {
        syncDraft(); const r = sheet.draft.rule; const v = Number(el.dataset.v);
        r.days = r.days.includes(v) ? r.days.filter(x => x !== v) : r.days.concat(v); drawSheet(); break;
      }
      case 'ask-delete': syncDraft(); sheet.confirmDelete = true; drawSheet(); break;
      case 'cancel-delete': syncDraft(); sheet.confirmDelete = false; drawSheet(); break;
      case 'do-delete': {
        const list = LIST[sheet.kind], gone = sheet.id;
        closeSheet();
        wait(200).then(() => animateOut([gone], () => { state[list] = state[list].filter(i => i.id !== gone); save(); render(); }));
        break;
      }
    }
  });
  function toast(msg, canUndo = true) {
    const el = $('toast');
    el.innerHTML = `<span>${esc(msg)}</span>${canUndo ? '<button data-act="undo">Undo</button>' : ''}`;
    el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() { $('toast').hidden = true; undo = null; }

  document.addEventListener('submit', e => { if (e.target.id === 'sheetForm') { e.preventDefault(); submitSheet(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });
  $('fab').addEventListener('click', () => {
    const tab = state.tab;
    if (tab === 'chores') openChoreSheet();
    else if (tab === 'habits') openHabitSheet();
    else if (tab === 'calendar') openTodoSheet(null, calSel);
    else if (tab === 'blocks') {
      const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
      const start = blkDate === today() ? Math.min(Math.ceil(nowMin / 60) * 60, DAY_END - 60) : 9 * 60;
      openBlockSheet(null, { date: blkDate, start, end: start + 60 });
    }
    else openTodoSheet();
  });

  // ---------- reminders ----------
  // Reminders show inside the app while it's open, and catch up on any you missed when you come back.
  const atMs = (date, min) => { const d = parse(date); d.setMinutes(min); return d.getTime(); };
  function pendingReminders() {
    const now = Date.now(), t = today(), out = [];
    const add = (key, at, kind, id, title, when) => {
      if (at <= now && now - at < 864e5 && !state.acked[key] && (state.snoozed[key] || 0) <= now) out.push({ key, at, kind, id, title, when });
    };
    state.todos.forEach(x => {
      if (x.done || !x.remind) return;
      const when = x.start != null ? `${isEvent(x) ? 'Starts' : 'Scheduled'} at ${fmtTime(x.start)}` : `Reminder for ${fmtTime(toMin(x.remind.slice(11)))}`;
      add(`t:${x.id}:${x.remind}`, atMs(x.remind.slice(0, 10), toMin(x.remind.slice(11))), isEvent(x) ? 'event' : 'todo', x.id, x.title, when);
    });
    state.chores.forEach(c => {
      if (!c.remindAt || c.next > t) return;
      add(`c:${c.id}:${t}`, atMs(t, toMin(c.remindAt)), 'chore', c.id, c.title, c.next < t ? 'Overdue chore' : 'Chore due today');
    });
    state.habits.forEach(x => {
      if (x.remindAt && habitOn(x, t) && !x.log[t]) add(`h:${x.id}:${t}`, atMs(t, toMin(x.remindAt)), 'habit', x.id, x.title, 'Habit for today');
    });
    state.blocks.forEach(b => {
      if (b.remindBefore == null || Date.now() >= atMs(b.date, b.end)) return;
      add(`b:${b.id}:${b.date}:${b.start}`, atMs(b.date, b.start - b.remindBefore), 'block', b.id, b.title, `Starts at ${fmtTime(b.start)}`);
    });
    return out.sort((a, b) => a.at - b.at);
  }
  let shownKey = null;
  function checkReminders() {
    const list = pendingReminders(), el = $('remind');
    if (!list.length) { el.hidden = true; shownKey = null; return; }
    const r = list[0], fresh = r.key !== shownKey;
    shownKey = r.key;
    const label = { todo: 'Task reminder', event: 'Event reminder', chore: 'Chore reminder', habit: 'Habit reminder', block: 'Time block' }[r.kind];
    const canDone = r.kind !== 'block';
    el.innerHTML = `<div class="r-top">
        <span class="r-icon">${ICON.bell}</span>
        <span class="r-text"><span class="r-kind">${label}</span><span class="r-title">${esc(r.title)}</span><span class="r-when">${esc(r.when)}</span></span>
        ${list.length > 1 ? `<span class="r-more">+${list.length - 1} more</span>` : ''}
      </div>
      <div class="r-actions">
        ${canDone ? `<button class="r-done" data-act="rem-done" data-key="${esc(r.key)}" data-kind="${r.kind}" data-id="${r.id}">Done</button>` : ''}
        <button data-act="rem-snooze" data-key="${esc(r.key)}">Snooze 10 min</button>
        <button data-act="rem-dismiss" data-key="${esc(r.key)}">${canDone ? 'Dismiss' : 'Got it'}</button>
      </div>`;
    el.hidden = false;
    if (fresh) { el.classList.remove('ring'); void el.offsetWidth; el.classList.add('ring'); beep(); }
  }
  // A short chime; browsers only allow sound after you've tapped the page once.
  let audio = null;
  document.addEventListener('pointerdown', () => {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  });
  function beep() {
    if (!audio) return;
    try {
      [0, 0.18].forEach((dt, i) => {
        const o = audio.createOscillator(), g = audio.createGain(), at = audio.currentTime + dt;
        o.type = 'square'; o.frequency.value = i ? 1320 : 880;
        g.gain.setValueAtTime(0.05, at); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.25);
        o.connect(g).connect(audio.destination); o.start(at); o.stop(at + 0.26);
      });
    } catch (e) {}
  }

  // ---------- "Add to iPhone Calendar" ----------
  // Builds a calendar file with an alert; iPhone opens it in the Calendar app.
  function buildIcs(kind, d, id) {
    const BY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
    const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\n/g, '\\n');
    const ymd = s => s.replace(/-/g, '');
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Dayplan//EN', 'BEGIN:VEVENT', `UID:${id}@dayplan`, `DTSTAMP:${stamp}`, `SUMMARY:${icsEsc(d.title.trim())}`];
    const timed = (date, min, len, before) => {
      const end = Math.min(min + len, DAY_END - 1);
      lines.push(`DTSTART:${ymd(date)}T${pad(Math.floor(min / 60))}${pad(min % 60)}00`, `DTEND:${ymd(date)}T${pad(Math.floor(end / 60))}${pad(end % 60)}00`);
      return `TRIGGER:-PT${before}M`;
    };
    const allDay = date => { lines.push(`DTSTART;VALUE=DATE:${ymd(date)}`, `DTEND;VALUE=DATE:${ymd(addDays(date, 1))}`); return 'TRIGGER:PT9H'; };
    let trigger;
    if (kind === 'todo') {
      if (d.start != null && d.due) {
        const before = d.remind ? Math.max(0, Math.round((atMs(d.due, d.start) - atMs(d.remind.slice(0, 10), toMin(d.remind.slice(11)))) / 60000)) : 0;
        trigger = timed(d.due, d.start, d.end - d.start, before);
        if (d.type === 'event' && d.until > d.due) lines.push(`RRULE:FREQ=DAILY;COUNT=${diffDays(d.until, d.due) + 1}`);
      } else if (d.type === 'event' && d.until > d.due) {
        lines.push(`DTSTART;VALUE=DATE:${ymd(d.due)}`, `DTEND;VALUE=DATE:${ymd(addDays(d.until, 1))}`);
        trigger = 'TRIGGER:PT9H';
      } else trigger = d.remind ? timed(d.remind.slice(0, 10), toMin(d.remind.slice(11)), 30, 0) : allDay(d.due || today());
    } else if (kind === 'block') {
      trigger = timed(d.date, d.start, d.end - d.start, d.remindBefore || 0);
    } else {
      const date = kind === 'chore' ? (d.start || today()) : today();
      trigger = d.remindAt ? timed(date, toMin(d.remindAt), 30, 0) : allDay(date);
      if (kind === 'habit') lines.push(`RRULE:FREQ=WEEKLY;BYDAY=${d.days.map(i => BY[i]).join(',')}`);
      else {
        const r = d.rule;
        lines.push(r.type === 'daily' ? 'RRULE:FREQ=DAILY'
          : r.type === 'interval' ? `RRULE:FREQ=DAILY;INTERVAL=${Math.max(1, r.every || 1)}`
          : r.type === 'monthly' ? `RRULE:FREQ=MONTHLY;BYMONTHDAY=${r.dom}`
          : `RRULE:FREQ=WEEKLY;BYDAY=${r.days.map(i => BY[i]).join(',')}`);
      }
    }
    lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(d.title.trim())}`, trigger, 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR');
    return lines.join('\r\n');
  }
  function saveIcs(name, text) {
    let framed = true;
    try { framed = window.top !== window.self; } catch (e) {}
    if (framed) {
      toast('This works once Dayplan is saved to your home screen. The preview can’t open the Calendar app.', false);
      return;
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'text/calendar' }));
    const a = document.createElement('a');
    a.href = url; a.download = name.replace(/[^\w -]+/g, '').slice(0, 60) + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  // ---------- dragging time blocks ----------
  let drag = null;
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest('[data-block]');
    if (!el) return;
    const b = state.blocks.find(x => x.id === el.dataset.block) || state.todos.find(x => x.id === el.dataset.block);
    if (!b) return;
    drag = { b, el, y0: e.clientY, pid: e.pointerId, mode: e.target.closest('[data-grip]') ? 'resize' : 'move', moved: false, start: b.start, end: b.end };
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  document.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const dy = e.clientY - drag.y0;
    if (!drag.moved && Math.abs(dy) < 6) return;
    drag.moved = true;
    drag.el.classList.add('dragging');
    const dm = Math.round(dy / HOUR * 60 / 15) * 15;
    const min0 = Number($('timeline').dataset.start) * 60;
    if (drag.mode === 'move') {
      const len = drag.b.end - drag.b.start;
      drag.start = Math.min(Math.max(drag.b.start + dm, min0), DAY_END - len);
      drag.end = drag.start + len;
    } else {
      drag.end = Math.min(Math.max(drag.b.end + dm, drag.b.start + 15), DAY_END);
    }
    drag.el.style.top = (drag.start - min0) * HOUR / 60 + 'px';
    drag.el.style.height = Math.max((drag.end - drag.start) * HOUR / 60, 24) + 'px';
    const bt = drag.el.querySelector('.b-time');
    bt.textContent = `${bt.dataset.prefix || ''}${fmtTime(drag.start)} – ${fmtTime(drag.end)}`;
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null;
    if (!d.moved) return;
    d.b.start = d.start; d.b.end = d.end;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 80);
    save(); render();
  };
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  // Re-render when the day rolls over or the app comes back to the foreground.
  let lastDay = today();
  const refresh = () => { if (today() !== lastDay) { lastDay = today(); render(); } checkReminders(); };
  document.addEventListener('visibilitychange', refresh);
  setInterval(refresh, 60000);
  setInterval(checkReminders, 15000);

  render();
  checkReminders();
})();
</script>

<script>
// Check for a new version whenever the app comes back to the screen, and reload into it.
// A home-screen app resumes where it left off instead of reloading, so this is what brings updates in.
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let pending = false;
  const reloadIfIdle = () => { if (!document.querySelector('.scrim')) location.reload(); else pending = true; };
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) reloadIfIdle(); });
  document.addEventListener('visibilitychange', () => { if (pending && document.visibilityState === 'hidden') location.reload(); });
}
</script>
</body>
</html>
